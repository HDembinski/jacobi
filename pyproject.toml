[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "jacobi"
description = "Fast numerical derivatives for analytic functions with arbitrary round-off error and error propagation"
readme = "README.rst"
authors = [{ name = "Hans Dembinski", email = "hans.dembinski@gmail.com" }]
maintainers = [
  { name = "Hans Dembinski", email = "hans.dembinski@gmail.com" },
  { name = "The Scikit-HEP admins", email = "scikit-hep-admins@googlegroups.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
  "numerical differentiation",
  "derivative",
  "jacobian",
  "error propagation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/hdembinski/jacobi"
Documentation = "https://hdembinski.github.io/jacobi/"
Repository = "https://github.com/hdembinski/jacobi"
"Bug Tracker" = "https://github.com/hdembinski/jacobi/issues"
Changelog = "https://github.com/hdembinski/jacobi/releases"

[dependency-groups]
test = [
  "pytest>=9",
  "pytest-cov>=7",
]
bench = [
  { include-group = "test" },
  "pytest-benchmark>=4",
]
plot = [
  "matplotlib>=3.5",
  "numdifftools>=0.9.41",
]
docs = [
  "sphinx>=7",
  "furo>=2023.8.17",
  "sphinx-copybutton",
]
dev = [
  { include-group = "test" },
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/jacobi/_version.py"

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
env-vars.PYTHONWARNDEFAULTENCODING = "1"

[tool.hatch.build.targets.sdist]
# The exploratory notebooks are large and not part of the package.
exclude = ["/notebook"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--doctest-modules"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["src/jacobi", "tests"]

[tool.coverage]
run.source = ["jacobi"]
report.exclude_also = [
  'if typing.TYPE_CHECKING:',
  'if TYPE_CHECKING:',
]

[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[tool.ruff]
show-fixes = true
# The exploratory notebooks are not maintained as code.
extend-exclude = ["notebook"]

[tool.ruff.lint]
extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "NPY",  # NumPy specific rules
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
  "YTT",  # flake8-2020
]
ignore = [
  "ISC001",  # Conflicts with the formatter
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "PT011",   # pytest.raises(ValueError) is too broad
]
isort.required-imports = ["from __future__ import annotations"]
flake8-unused-arguments.ignore-variadic-names = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "D", "PLR", "T20"]
"bench/**" = ["ARG", "D", "PLR", "T20"]
"docs/**" = ["D", "T20"]
"noxfile.py" = ["T20"]

[tool.pylint]
py-version = "3.10"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
]

[tool.codespell]
skip = "*.svg,*.ipynb,*.lock"
